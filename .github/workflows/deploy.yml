name: Deploy Automático — Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências e Compilar TypeScript
        run: |
          npm ci
          npm run build

      - name: Deploy na Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Entra na pasta do projeto no servidor (ajuste o caminho se necessário)
            cd ~/Projeto-BotMonitoramento-Sefaz-Eveo || cd ~/sefaz-bot || mkdir -p ~/sefaz-bot && cd ~/sefaz-bot
            
            # Atualiza o código via Git
            git pull origin main || true

            # Instala dependências e compila
            npm ci
            npm run build

            # Reinicia ou inicia o bot no PM2
            pm2 reload sefaz-discord-bot || pm2 start dist/bot.js --name "sefaz-discord-bot"
            pm2 save
